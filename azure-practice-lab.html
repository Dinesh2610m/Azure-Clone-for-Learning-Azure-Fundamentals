<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azure Practice Lab</title>
<style>
:root{--bg:#f3f2f1;--cd:#fff;--tx:#201f1e;--mu:#605e5c;--bd:#d2d0ce;--bl:#0078d4;--lk:#0067b8;--ok:#107c10;--er:#a4262c;--nv:#faf9f8;--tp:#003067}
@media(prefers-color-scheme:dark){:root{--bg:#1b1a19;--cd:#292827;--tx:#f3f2f1;--mu:#a19f9d;--bd:#484644;--lk:#6cb8f6;--ok:#6bb700;--er:#f1707b;--nv:#252423;--tp:#0b1d33}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:grid;grid-template-rows:48px 1fr;height:100%}
.top{background:var(--tp);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px}
.top b{font-weight:600;white-space:nowrap}.top input{flex:1;max-width:480px;padding:6px 10px;border:1px solid #fff4;background:#fff2;color:#fff;border-radius:3px}
.top input::placeholder{color:#fffa}.top button:first-of-type{margin-left:auto}
.body{display:grid;grid-template-columns:200px 1fr auto;min-height:0}
.side{background:var(--nv);border-right:1px solid var(--bd);overflow:auto;padding:8px 0}
.side a,.menu a{display:block;padding:8px 16px;cursor:pointer;color:var(--tx)}
.side a:hover,.menu a:hover{background:var(--bd)}.side a.on,.menu a.on{background:var(--bd);border-left:3px solid var(--bl);padding-left:13px;font-weight:600}
.main{overflow:auto;padding:20px 28px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}h2{font-size:16px;margin:18px 0 8px}
.sub{color:var(--mu);margin-bottom:14px}.lk{color:var(--lk);cursor:pointer}.lk:hover{text-decoration:underline}
button{font:inherit;padding:6px 14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:2px;cursor:pointer}
button:hover{background:var(--bd)}button.p{background:var(--bl);border-color:var(--bl);color:#fff}button.p:hover{background:#106ebe}
button.d{color:var(--er)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bl)}
.tb{width:100%;border-collapse:collapse;background:var(--cd)}.tb th,.tb td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd)}
.tb th{font-weight:600;color:var(--mu);background:var(--nv)}.tb tr.dm td{color:var(--mu)}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.card{background:var(--cd);border:1px solid var(--bd);padding:14px 16px;margin-bottom:12px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{width:112px;text-align:center;padding:12px 4px;cursor:pointer;border:1px solid transparent}
.tile:hover{border-color:var(--bd);background:var(--cd)}.tile i{font-style:normal;font-size:26px;display:block}
.blade{display:grid;grid-template-columns:190px 1fr;gap:0;border:1px solid var(--bd);background:var(--cd);min-height:380px}
.menu{border-right:1px solid var(--bd);background:var(--nv);padding:6px 0}.blade .in{padding:14px 18px}
.ess{display:grid;grid-template-columns:150px 1fr;gap:6px 10px}.ess span:nth-child(odd){color:var(--mu)}
label{display:block;margin:12px 0 4px;font-weight:600}.fi{width:100%;max-width:420px;padding:6px 8px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:6px}.tabs a{padding:8px 16px;cursor:pointer}.tabs a.on{border-bottom:2px solid var(--bl);font-weight:600}
.er{color:var(--er)}.ok{color:var(--ok)}.msg{padding:10px 12px;border-left:4px solid;background:var(--nv);margin:10px 0}
.msg.e{border-color:var(--er)}.msg.s{border-color:var(--ok)}.msg.i{border-color:var(--bl)}
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:5}
.mo{background:var(--cd);width:min(480px,94vw);max-height:90vh;overflow:auto;padding:18px 22px;border:1px solid var(--bd)}
.tp{width:340px;border-left:1px solid var(--bd);background:var(--cd);overflow:auto;padding:14px 16px}
.tp ol{padding-left:20px}.tp li{margin:7px 0}.badge{font-size:12px;padding:1px 7px;border:1px solid var(--bd);border-radius:10px;color:var(--mu)}
.badge.d{color:var(--ok);border-color:var(--ok)}
.sp{display:inline-block;width:16px;height:16px;border:3px solid var(--bd);border-top-color:var(--bl);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.sp{animation:none}}
.toast{position:fixed;top:58px;right:16px;background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--ok);padding:10px 14px;z-index:9;box-shadow:0 2px 8px #0004}
.mc{display:flex;flex-direction:column;min-width:0;min-height:0}.mc .main{flex:1}
.term{height:280px;background:#0c0c0c;color:#d4d4d4;font:13px Consolas,"Cascadia Mono",monospace;display:flex;flex-direction:column;border-top:3px solid var(--bl)}
#tl{flex:1;overflow:auto;padding:8px 12px}.term pre{margin:0 0 4px;white-space:pre-wrap;word-break:break-word;font:inherit}.term pre.e{color:#f48771}
.term pre.c span,.tin span{color:#6ccb5f}.tin{display:flex;gap:8px;padding:6px 12px;border-top:1px solid #333}.tin input{flex:1;background:none;border:0;color:#fff;font:inherit;outline:0}
@media(max-width:900px){.body{grid-template-columns:1fr}.side{display:none}.tp{width:auto;border-left:0}.blade{grid-template-columns:1fr}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let S;try{S=JSON.parse(localStorage.getItem('azlab'))}catch(e){}
S=S||{rgs:[],res:[],done:{},task:null,steps:{},last:null};
const save=()=>{try{localStorage.setItem('azlab',JSON.stringify(S))}catch(e){}};
let V={p:'home'},W=null,M=null,panel=true;
const LOC=['East US','West US 2','West Europe','Central India','South India','Southeast Asia','UK South'];
const TY={
 rg:{n:'Resource group',pl:'Resource groups',ic:'📦',pr:'Microsoft.Resources/resourceGroups'},
 storage:{n:'Storage account',pl:'Storage accounts',ic:'🗄️',pr:'Microsoft.Storage/storageAccounts'},
 nsg:{n:'Network security group',pl:'Network security groups',ic:'🛡️',pr:'Microsoft.Network/networkSecurityGroups'},
 vnet:{n:'Virtual network',pl:'Virtual networks',ic:'🌐',pr:'Microsoft.Network/virtualNetworks'},
 vm:{n:'Virtual machine',pl:'Virtual machines',ic:'🖥️',pr:'Microsoft.Compute/virtualMachines'}};
const F={rg:[],nsg:[],
 storage:[['perf','Performance','sel',['Standard','Premium']],['red','Redundancy','sel',['LRS','GRS','ZRS']],['tier','Default access tier','sel',['Hot','Cool']]],
 vnet:[['space','IPv4 address space','txt','10.0.0.0/16'],['sn','First subnet name','txt','default'],['sp','First subnet address range','txt','10.0.0.0/24']],
 vm:[['img','Image','sel',['Ubuntu Server 22.04 LTS','Windows Server 2022']],['size','Size','sel',['Standard_B1s','Standard_B2s','Standard_D2s_v3']],['vnet','Virtual network','vn'],['nsg','NIC network security group','ns'],['user','Administrator username','txt','azureuser']]};
const R=(t,n,g)=>S.res.find(r=>r.t===t&&r.n===n&&r.g===g),byId=id=>S.res.find(r=>r.id===id);
const mkRg=(n,l)=>S.rgs.push({n,l}),mkRes=(t,n,g,l,p)=>S.res.push({id:uid(),t,n,g,l,p});
const DEF=[{n:'AllowVnetInBound',pri:65000,src:'Service Tag',sv:'VirtualNetwork',port:'*',proto:'Any',act:'Allow',d:1},
 {n:'AllowAzureLoadBalancerInBound',pri:65001,src:'Service Tag',sv:'AzureLoadBalancer',port:'*',proto:'Any',act:'Allow',d:1},
 {n:'DenyAllInBound',pri:65500,src:'Any',sv:'*',port:'*',proto:'Any',act:'Deny',d:1}];
const allRules=n=>[...n.p.rules,...DEF].sort((a,b)=>a.pri-b.pri);
function evalPort(n,port){return allRules(n).find(r=>(r.src==='Any'||(r.src==='Service Tag'&&r.sv==='Internet'))&&r.port.split(',').some(x=>{x=x.trim();if(x==='*')return 1;if(x.includes('-')){const[a,b]=x.split('-').map(Number);return port>=a&&port<=b}return+x===port}))}
const portOk=s=>s.split(',').every(x=>/^(\*|\d{1,5}(-\d{1,5})?)$/.test(x.trim())&&x.trim().split('-').every(v=>v==='*'||+v<=65535));
const toast=m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),3500)};
const rule=(n,pri,port,act,src='Any',sv='*')=>({n,pri,src,sv,port,proto:'TCP',act});
const nsgP=rules=>({rules}),vmP=(nsg,vnet)=>({size:'Standard_B2s',img:'Ubuntu Server 22.04 LTS',vnet,nsg,state:'Running',user:'azureuser',ip:'20.'+(40+Math.random()*150|0)+'.'+(Math.random()*250|0)+'.'+(1+Math.random()*250|0)});

/* ---------- TASKS ---------- */
const TASKS=[
{id:'t1',lv:'Build',ti:'Create a resource group',lab:[],sc:'Every Azure resource lives in a resource group. Create one called rg-learn in East US.',
 st:['Use the search bar at the top, type Resource groups and open it.','Click + Create.','Subscription: keep the default. Resource group name: rg-learn. Region: East US.','Click Review + create, wait for “Validation passed”, then click Create.','Click Check my work below.'],
 ck:()=>S.rgs.find(r=>r.n==='rg-learn'&&r.l==='East US')?[1,'rg-learn exists in East US.']:[0,'No resource group named rg-learn in East US yet.']},
{id:'t2',lv:'Build',ti:'Store unstructured data in Blob storage',lab:[],sc:'Your app needs to keep documents. In rg-learn, create a storage account, add a private container named documents and upload one file. (Complete the first task first.)',
 st:['Open Storage accounts → + Create.','Basics: Resource group rg-learn, Storage account name (3–24 lowercase letters/numbers, globally unique, e.g. stlearn4829), Region East US, Performance Standard, Redundancy LRS.','Review + create → Create → Go to resource.','Left menu: Data storage → Containers → + New container.','Name: documents. Anonymous access level: Private (no anonymous access). Click Create.','Open the documents container → Upload → pick any file → Upload. Nothing is really stored; the file name is only recorded.','Click Check my work.'],
 ck:()=>{const a=S.res.find(r=>r.t==='storage'&&r.g==='rg-learn');if(!a)return[0,'No storage account in rg-learn yet.'];const c=a.p.containers.find(c=>c.n==='documents');if(!c)return[0,'Storage account found, but no container named documents.'];if(c.acc!=='private')return[0,'The documents container must be Private.'];return c.blobs.length?[1,'Container documents is private and holds '+c.blobs.length+' blob(s).']:[0,'Container is ready; upload at least one blob.']}},
{id:'t3',lv:'Build',ti:'Create an NSG that allows HTTPS',lab:[],sc:'Create a network security group nsg-web in rg-learn (East US) that lets HTTPS (443) in from the internet.',
 st:['Open Network security groups → + Create.','Resource group rg-learn, Name nsg-web, Region East US → Review + create → Create → Go to resource.','Settings → Inbound security rules → + Add.','Source: Any. Destination port ranges: 443. Protocol: TCP. Action: Allow. Priority: 100. Name: Allow-HTTPS. Click Add.','Click Check my work.'],
 ck:()=>{const n=R('nsg','nsg-web','rg-learn');if(!n)return[0,'No NSG named nsg-web in rg-learn.'];return evalPort(n,443).act==='Allow'?[1,'443 is allowed from the internet.']:[0,'nsg-web exists, but inbound 443 from the internet is still denied. New NSGs block internet traffic by default.']}},
{id:'t4',lv:'Troubleshoot',ti:'Website on vm-web-01 times out',lab:['rg-prod-web'],sc:'Users say http://vm-web-01 (port 80) times out. The VM is running and the app is healthy. Find the cause and fix it. A legacy app depends on the Block-Legacy rule, so do not delete it.',
 seed(){mkRg('rg-prod-web','West Europe');mkRes('vnet','vnet-prod','rg-prod-web','West Europe',{space:'10.10.0.0/16',subnets:[{n:'default',pfx:'10.10.0.0/24',nsg:''}]});mkRes('nsg','nsg-web-prod','rg-prod-web','West Europe',nsgP([rule('Allow-HTTP',300,'80','Allow'),rule('Block-Legacy',200,'*','Deny')]));mkRes('vm','vm-web-01','rg-prod-web','West Europe',vmP('nsg-web-prod','vnet-prod'))},
 st:['Virtual machines → vm-web-01 → Networking. Note which NSG is attached.','Run IP flow verify for port 80 on that page: it tells you whether traffic is allowed and which rule decides.','Open that NSG → Inbound security rules. Rules are evaluated from the lowest priority number up; the first match wins.','Click the Allow-HTTP rule and give it a lower number than the rule that blocks it (e.g. 150). Click Save.','Run IP flow verify again, then click Check my work.'],
 ck:()=>{const n=R('nsg','nsg-web-prod','rg-prod-web');if(!n)return[0,'nsg-web-prod was deleted.'];if(!n.p.rules.find(r=>r.n==='Block-Legacy'))return[0,'Block-Legacy must stay. Fix the ordering instead of deleting it.'];return evalPort(n,80).act==='Allow'?[1,'Port 80 is now allowed. Priority order was the problem.']:[0,'Port 80 is still blocked. Use IP flow verify to see which rule decides.']}},
{id:'t5',lv:'Security',ti:'SSH is open to the whole internet',lab:['rg-sec'],sc:'Security flagged jump-vm: anyone on the internet can reach SSH. Close this hole, but keep HTTPS (443) working.',
 seed(){mkRg('rg-sec','Central India');mkRes('vnet','vnet-sec','rg-sec','Central India',{space:'10.20.0.0/16',subnets:[{n:'default',pfx:'10.20.0.0/24',nsg:''}]});mkRes('nsg','nsg-jump','rg-sec','Central India',nsgP([rule('Allow-SSH',100,'22','Allow'),rule('Allow-HTTPS',110,'443','Allow')]));mkRes('vm','jump-vm','rg-sec','Central India',vmP('nsg-jump','vnet-sec'))},
 st:['Network security groups → nsg-jump → Inbound security rules.','Look at the Source column of every rule that opens port 22.','Edit Allow-SSH: Source = IP Addresses, Source IP = your office IP (e.g. 203.0.113.10). Or delete the rule if SSH is not needed. Save.','Check my work.'],
 ck:()=>{const n=R('nsg','nsg-jump','rg-sec');if(!n)return[0,'nsg-jump was deleted.'];if(evalPort(n,22).act==='Allow')return[0,'SSH (22) is still reachable from the internet.'];return evalPort(n,443).act==='Allow'?[1,'SSH is no longer open to the internet and HTTPS still works.']:[0,'You closed SSH but also broke HTTPS (443).']}},
{id:'t6',lv:'Security',ti:'Invoices are publicly readable',lab:['rg-data'],sc:'An auditor found that anyone with the URL can download files from the invoices container in storage account stinvoices001. Lock it down without deleting the data.',
 seed(){mkRg('rg-data','East US');mkRes('storage','stinvoices001','rg-data','East US',{perf:'Standard',red:'LRS',tier:'Hot',anon:true,containers:[{n:'invoices',acc:'blob',blobs:[{n:'2026-01.pdf',sz:'184 KiB'},{n:'2026-02.pdf',sz:'201 KiB'}]}]})},
 st:['Storage accounts → stinvoices001 → Data storage → Containers.','Check the Anonymous access level column.','Open invoices → Change access level → Private (no anonymous access) → OK.','Optional hardening: Settings → Configuration → Allow Blob anonymous access = Disabled → Save.','Check my work.'],
 ck:()=>{const a=R('storage','stinvoices001','rg-data');const c=a&&a.p.containers.find(c=>c.n==='invoices');if(!c)return[0,'The invoices container is gone. Do not delete the data.'];if(!c.blobs.length)return[0,'Blobs were removed. Keep the data.'];return c.acc==='private'||!a.p.anon?[1,'Anonymous access is blocked and the blobs are intact.']:[0,'invoices still allows anonymous read access.']}}];
const task=id=>TASKS.find(t=>t.id===id);
function reseed(t){if(!t.seed)return;S.rgs=S.rgs.filter(r=>!t.lab.includes(r.n));S.res=S.res.filter(r=>!t.lab.includes(r.g));t.seed()}

/* ---------- ACTIONS ---------- */
const go=o=>{V=o;W=null;render()};
const A={
 go:d=>go({p:d.p,id:d.id,t:d.t,s:d.s||'ov',c:d.c}),
 cr:d=>{const f={l:'East US',g:S.rgs[0]?S.rgs[0].n:'__new',n:''};F[d.t].forEach(x=>{if(x[2]==='sel')f[x[0]]=x[3][0];else if(x[2]==='txt')f[x[0]]=x[3];else f[x[0]]=''});W={t:d.t,tab:0,f,dep:null,errs:[]};V={p:'create'};render()},
 tab:d=>{W.tab=+d.i;if(W.tab===1)W.errs=validate();render()},
 deploy:()=>{W.errs=validate();if(W.errs.length){W.tab=1;return render()}W.tab=2;W.dep=0;render();setTimeout(()=>{finish();W.dep=1;render()},2200)},
 goto:()=>{const r=W.made;go(W.t==='rg'?{p:'rg',id:r}:{p:'res',id:r,s:'ov'})},
 del:d=>{const r=d.t==='rg'?null:byId(d.id),name=d.t==='rg'?d.id:r.n;M={title:'Delete '+TY[d.t].n.toLowerCase(),v:{},body:()=>`<p>Are you sure you want to delete <b>${esc(name)}</b>?${d.t==='rg'?' All resources inside it will be deleted too. Type the resource group name to confirm.':''}</p>${d.t==='rg'?'<input class="fi" data-m="c" value="'+esc(M.v.c||'')+'">':''}`,ok:'Delete',fn:()=>{if(d.t==='rg'){if(M.v.c!==name)return'The name you typed does not match.';S.rgs=S.rgs.filter(x=>x.n!==name);S.res=S.res.filter(x=>x.g!==name)}else S.res=S.res.filter(x=>x.id!==d.id);save();toast('Deleted '+name);V={p:'list',t:d.t==='rg'?'rg':d.t}}};render()},
 mok:()=>{const e=M.fn();if(e)M.err=e;else{M=null;save()}render()},mx:()=>{M=null;render()},
 rule:d=>{const n=byId(d.id),old=d.n?n.p.rules.find(r=>r.n===d.n):null;M={title:old?'Edit inbound security rule':'Add inbound security rule',v:old?{...old,nm:old.n,sv:old.src==='Any'?'*':old.sv}:{src:'Any',sv:'*',port:'*',proto:'Any',act:'Allow',pri:String(Math.max(100,...n.p.rules.map(r=>r.pri+10))),nm:''},
  body:()=>{const v=M.v;return `<label>Source</label>${sel('src',['Any','IP Addresses','Service Tag'],v.src)}${v.src==='Any'?'':`<label>${v.src==='IP Addresses'?'Source IP addresses/CIDR ranges':'Source service tag'}</label><input class="fi" data-m="sv" value="${esc(v.sv==='*'?'':v.sv)}" placeholder="${v.src==='IP Addresses'?'203.0.113.10':'Internet'}">`}<label>Destination port ranges</label><input class="fi" data-m="port" value="${esc(v.port)}"><label>Protocol</label>${sel('proto',['Any','TCP','UDP'],v.proto)}<label>Action</label>${sel('act',['Allow','Deny'],v.act)}<label>Priority</label><input class="fi" data-m="pri" type="number" value="${esc(v.pri)}"><label>Name</label><input class="fi" data-m="nm" value="${esc(v.nm)}" ${old?'disabled':''}>`},
  ok:old?'Save':'Add',fn:()=>{const v=M.v,pri=+v.pri;if(!/^[A-Za-z][\w.-]{0,79}$/.test(v.nm||''))return'Name must start with a letter and use letters, numbers, _ . or -.';if(!old&&n.p.rules.some(r=>r.n===v.nm))return'A rule with this name already exists.';if(!(pri>=100&&pri<=4096))return'Priority must be between 100 and 4096.';if(n.p.rules.some(r=>r.pri===pri&&r.n!==(old&&old.n)))return'Priority '+pri+' is already used by another rule.';if(!portOk(v.port||''))return'Enter a port (80), a range (8000-8100), a list (80,443) or *.';if(v.src!=='Any'&&!(v.sv||'').trim())return'Source value is required.';const o={n:v.nm,pri,src:v.src,sv:v.src==='Any'?'*':v.sv.trim(),port:v.port.trim(),proto:v.proto,act:v.act};if(old)Object.assign(old,o);else n.p.rules.push(o);toast((old?'Saved rule ':'Added rule ')+o.n)}};render()},
 delrule:d=>{const n=byId(d.id);n.p.rules=n.p.rules.filter(r=>r.n!==d.n);save();toast('Deleted rule '+d.n);render()},
 ctn:d=>{const a=byId(d.id);M={title:'New container',v:{nm:'',acc:'private'},body:()=>`<label>Name</label><input class="fi" data-m="nm" value="${esc(M.v.nm)}"><label>Anonymous access level</label><select class="fi" data-m="acc"><option value="private">Private (no anonymous access)</option><option value="blob" ${a.p.anon?'':'disabled'} ${M.v.acc==='blob'?'selected':''}>Blob (anonymous read access for blobs only)</option><option value="container" ${a.p.anon?'':'disabled'} ${M.v.acc==='container'?'selected':''}>Container (anonymous read access for containers and blobs)</option></select>${a.p.anon?'':'<div class="sub">Anonymous access is disabled on this storage account.</div>'}`,ok:'Create',fn:()=>{const n=M.v.nm;if(!/^[a-z0-9]([a-z0-9]|-(?!-)){1,61}[a-z0-9]$/.test(n))return'Name must be 3-63 chars: lowercase letters, numbers and single hyphens, starting and ending with a letter or number.';if(a.p.containers.some(c=>c.n===n))return'A container with this name already exists.';a.p.containers.push({n,acc:M.v.acc,blobs:[]});toast('Successfully created container '+n)}};render()},
 acc:d=>{const a=byId(d.id),c=a.p.containers.find(c=>c.n===d.c);M={title:'Change access level',v:{acc:c.acc},body:()=>`<select class="fi" data-m="acc"><option value="private">Private (no anonymous access)</option><option value="blob" ${a.p.anon?'':'disabled'} ${M.v.acc==='blob'?'selected':''}>Blob</option><option value="container" ${a.p.anon?'':'disabled'} ${M.v.acc==='container'?'selected':''}>Container</option></select>`,ok:'OK',fn:()=>{c.acc=M.v.acc;toast('Access level updated')}};render()},
